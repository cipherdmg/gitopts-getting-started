#
# `Operational Decision Manager Database`
# To preserve sensitive data, you must create a secret that encapsulates the database user and password before you install the Helm release.
#
# Specify the name of the secret as the value for the parameters internalDatabase.secretCredentials or externalDatabase.secretCredentials, depending on the type of database you use.
# For more information, see Preparing to install Operational Decision Manager.
#
# @see [Preparing to install Operational Decision Manager](https://www.ibm.com/docs/en/odm/9.5.0?topic=production-preparing-install-operational-decision-manager)
# @see [Installing ODM For Developers](https://www.ibm.com/docs/en/odm/9.5.0?topic=reference-odm-developers-configuration-parameters)
internalDatabase:
  annotations: {}
  labels: {}
  databaseName: odmdb
  tagOrDigest:
  user: odmusr # deprecated, please use secretCredentials
  password: "odmpwd" # deprecated, please use secretCredentials
  secretCredentials: ""
  populateSampleData: true
  persistence:
    enabled: true
    useDynamicProvisioning: true
    storageClassName: "nfs-client-enterprise"
    resources:
      requests:
        storage: 5Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 500Mi
    limits:
      cpu: 2
      memory: 4096Mi
      ephemeral-storage: 1G
  runAsUser:

externalDatabase:
  type: "db2"
  serverName: ""
  databaseName: ""
  url: ""
  user: "" # deprecated, please use secretCredentials
  password: "" # deprecated, please use secretCredentials
  secretCredentials: ""
  port: ""
  sslSecretRef:
  ## Optionally specify a list of driversUrl using --set externalDatabase.driversUrl="{url1,url2}" in cli
  driversUrl: []
  # - url1
  # - url2
  decisionServer:
    type: ""
    serverName: ""
    databaseName: ""
    url: ""
    user: "" # deprecated, please use secretCredentials
    password: "" # deprecated, please use secretCredentials
    secretCredentials: ""
    port: ""
    sslSecretRef:
    ## Optionally specify a list of driversUrl using --set externalDatabase.driversUrl="{url1,url2}" in cli
    driversUrl: []
    # - url1
    # - url2
  decisionCenter:
    type: ""
    serverName: ""
    databaseName: ""
    url: ""
    user: "" # deprecated, please use secretCredentials
    password: "" # deprecated, please use secretCredentials
    secretCredentials: ""
    port: ""
    sslSecretRef:
    ## Optionally specify a list of driversUrl using --set externalDatabase.driversUrl="{url1,url2}" in cli
    driversUrl: []
    # - url1
    # - url2

