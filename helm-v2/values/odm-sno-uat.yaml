# Default values for odmcharts.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Accept the terms of the IBM license by setting the license parameter to "true"
license: true

# Users password is required if authSecretRef is not set.
# Set the password for odm default users.
usersPassword: ""
# usersPassword: "odmadmin"

image:
  repository: "cp.icr.io/cp/cp4a/odm"
  tag: 9.5.0.1-IF010
  pullPolicy: IfNotPresent
## Optionally specify an list of imagePullSecrets.
## Secrets must be manually created in the namespace.
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  pullSecrets: []
  # - admin.registrykey
  # - admin.registrykey

  arch: "" # deprecated
  useArch: false # only for support

serviceAccountName: ""

service:
  enableTLS: true
  # https://kubernetes.io/docs/concepts/services-networking/dual-stack/
  ipFamilies:
  ipFamilyPolicy:
  type: ClusterIP
  enableRoute: false
  hostname: ""
  ingress:
    annotations:
    class:
    enabled: false
    host:
    tlsHosts: []
    tlsSecretRef:

decisionServerRuntime:
  annotations: {}
  # dedicated is a list of dicts with the following contents:
  # - name: "<servicename>" (mandatory)
  #   paths: [] (mandatory)
  #   resources: {} (optional, same format as decisionServerRuntime.resources below)
  #   webConfigRef: "" (optional)
  #   xuConfigRef: "" (optional)
  #   autoscaling: {} #optional
  dedicated: []
  enabled: true
  tagOrDigest:
  replicaCount: 1
  loggingRef:
  jvmOptionsRef:
  monitorRef:
  logstashCollectorRef:
  libertyHookRef:
  xuConfigRef:
  webConfigRef:
  extendRoleMapping: false
  enableTLSAuth:
  customScriptsRef:
  lifecycleHooksSecretRef:
  initContainer:
    image:
    command:
    configRef:
    configOidcRef:
    resources:
      requests:
        cpu: 200m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 200Mi
    existingClaimName:
    env:
  contextRoot:
  resources:
    requests:
      cpu: 1
      memory: 2Gi
      ephemeral-storage: 50Mi
    limits:
      cpu: 4
      memory: 6Gi
      ephemeral-storage: 5Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetAverageUtilization:           # deprecated, replaced by targetAverageCpuUtilization
    targetAverageCpuUtilization: 300
    targetAverageMemoryUtilization: 600
    behavior:
  nodeAffinity:
  customPodAntiAffinity:
  podDisruptionBudget:
  tolerations:
  topologySpreadConstraints: []
  labels: {}
  networkPolicy:
    egress:
    ingress:
  downloadUrl: []
  # - url1
  # - url2
  enableAuditLog: false
  sidecar:
    enabled: false
    image:
    confSecretRef:
    resources:
    probes:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
  enableMutualTLS: false
  routeName:

