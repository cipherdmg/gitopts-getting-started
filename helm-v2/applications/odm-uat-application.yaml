apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odm-uat
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/cipherdmg/gitopts-getting-started
    targetRevision: HEAD
    path: overlays/uat
    
  destination:
    server: https://kubernetes.default.svc
    namespace: odm-uat
  
  syncPolicy:
    automated:
      prune: false  # Set to true for automatic cleanup of deleted resources
      selfHeal: true  # Automatically sync when cluster state differs from Git
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true  # Automatically create the namespace if it doesn't exist
      - PrunePropagationPolicy=foreground
      - PruneLast=true  # Prune resources as a final step
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas  # Ignore replica count differences (for HPA)

