{{- if and (or ( not (empty .Values.decisionServerRuntime.monitorRef)) ( not (empty .Values.customization.monitorRef))) (.Values.decisionServerRuntime.enabled) (.Values.customization.enablePodMonitor) ( .Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor") }}
kind: PodMonitor
apiVersion: monitoring.coreos.com/v1
metadata:
  name: {{ template "odm-ds-runtime-pod-monitor.fullname" . }}
  labels:
{{ include "odm-additional-labels" (dict "componentName" "decisionServerRuntime" "root" .) | indent 4 }}
spec:
  selector:
    matchLabels:
      run: {{ template "odm.decisionserverruntime.fullname" . }}
  podMetricsEndpoints:
  - port: dsr-port
{{- if .Values.service.enableTLS }}
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
{{- else }}
    scheme: http
{{- end }}
{{- end -}}
