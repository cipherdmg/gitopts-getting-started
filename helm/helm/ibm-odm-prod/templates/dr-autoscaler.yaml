{{- if .Values.decisionRunner.autoscaling }}
{{- if .Values.decisionRunner.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ template "odm.decisionrunner.fullname" . }}
  labels:
{{ include "odm-additional-labels" (dict "componentName" "decisionRunner" "root" .) | indent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ template "odm.decisionrunner.fullname" . }}
  minReplicas: {{ .Values.decisionRunner.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.decisionRunner.autoscaling.maxReplicas }}
  metrics:
    {{- if and (empty (.Values.decisionRunner.autoscaling.targetAverageUtilization)) (empty (.Values.decisionRunner.autoscaling.targetAverageCpuUtilization)) (empty (.Values.decisionRunner.autoscaling.targetAverageMemoryUtilization)) }}
    {{- required "\nAt least one metric (CPU or Memory) should be used in decisionRunner.autoscaling\n" "" }}
    {{- end }}
    {{- if .Values.decisionRunner.autoscaling.targetAverageUtilization }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.decisionRunner.autoscaling.targetAverageUtilization }}
    {{- else }}
    {{- if .Values.decisionRunner.autoscaling.targetAverageCpuUtilization }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.decisionRunner.autoscaling.targetAverageCpuUtilization }}
    {{- end }}
    {{- end }}
    {{- if .Values.decisionRunner.autoscaling.targetAverageMemoryUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.decisionRunner.autoscaling.targetAverageMemoryUtilization }}
    {{- end }}
  {{- if .Values.decisionRunner.autoscaling.behavior }}
  behavior:
{{ toYaml .Values.decisionRunner.autoscaling.behavior | indent 4 }}
  {{- else }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 3000
    scaleUp:
      stabilizationWindowSeconds: 120
  {{- end }}
{{- end }}
{{- end }}
