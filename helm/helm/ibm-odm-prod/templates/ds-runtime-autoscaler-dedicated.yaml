{{- if and (.Values.decisionServerRuntime.enabled) (not (empty .Values.decisionServerRuntime.dedicated)) }}
{{- range $service:=.Values.decisionServerRuntime.dedicated }}
{{- with $ -}}
{{- if $service.autoscaling }}
{{- if $service.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ template "odm.decisionserverruntime.dedicated.fullname" dict "root" . "service" $service }}
  labels:
{{ include "odm-additional-labels" (dict "componentName" "decisionServerRuntime" "root" .) | indent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ template "odm.decisionserverruntime.dedicated.fullname" dict "root" . "service" $service }}
  minReplicas: {{ $service.autoscaling.minReplicas | default .Values.decisionServerRuntime.autoscaling.minReplicas }}
  maxReplicas: {{ $service.autoscaling.maxReplicas | default .Values.decisionServerRuntime.autoscaling.maxReplicas }}
  metrics:
    {{- $cpu    := or ($service.autoscaling.targetAverageCpuUtilization)    (and (not (hasKey $service.autoscaling "targetAverageCpuUtilization"))    (.Values.decisionServerRuntime.autoscaling.targetAverageCpuUtilization)) }}
    {{- $memory := or ($service.autoscaling.targetAverageMemoryUtilization) (and (not (hasKey $service.autoscaling "targetAverageMemoryUtilization")) (.Values.decisionServerRuntime.autoscaling.targetAverageMemoryUtilization)) }}
    {{- if not (or $cpu $memory) }}
    {{- required (printf "\nAt least one metric (CPU or Memory) should be used in decisionServerRuntime.dedicated.%s\n" $service.name) "" }}
    {{- end }}
    {{- if $cpu }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $service.autoscaling.targetAverageCpuUtilization | default .Values.decisionServerRuntime.autoscaling.targetAverageCpuUtilization }}
    {{- end }}
    {{- if $memory }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $service.autoscaling.targetAverageMemoryUtilization | default .Values.decisionServerRuntime.autoscaling.targetAverageMemoryUtilization }}
    {{- end }}  
  {{- $behavior := $service.autoscaling.behavior | default .Values.decisionServerRuntime.autoscaling.behavior }}
  {{- if $behavior }}
  behavior:
{{ toYaml $behavior | indent 4 }}
  {{- else }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  {{- end }}
---
{{  end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
