{{- if and (or ( not (empty .Values.decisionRunner.monitorRef)) ( not (empty .Values.customization.monitorRef))) (.Values.decisionRunner.enabled) (.Values.customization.enablePodMonitor) ( .Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor") }}
kind: PodMonitor
apiVersion: monitoring.coreos.com/v1
metadata:
  name: {{ template "odm-dr-pod-monitor.fullname" . }}
  labels:
{{ include "odm-additional-labels" (dict "componentName" "decisionRunner" "root" .) | indent 4 }}
spec:
  selector:
    matchLabels:
      run: {{ template "odm.decisionrunner.fullname" . }}
  podMetricsEndpoints:
  - port: dr-port
{{- if .Values.service.enableTLS }}
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
{{- else }}
    scheme: http
{{- end }}
{{- end -}}
