{{- if .Values.decisionServerRuntime.autoscaling }}
{{- if .Values.decisionServerRuntime.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ template "odm.decisionserverruntime.fullname" . }}
  labels:
{{ include "odm-additional-labels" (dict "componentName" "decisionServerRuntime" "root" .) | indent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ template "odm.decisionserverruntime.fullname" . }}
  minReplicas: {{ .Values.decisionServerRuntime.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.decisionServerRuntime.autoscaling.maxReplicas }}
  metrics:
    {{- if and (empty (.Values.decisionServerRuntime.autoscaling.targetAverageUtilization)) (empty (.Values.decisionServerRuntime.autoscaling.targetAverageCpuUtilization)) (empty (.Values.decisionServerRuntime.autoscaling.targetAverageMemoryUtilization)) }}
    {{- required "\nAt least one metric (CPU or Memory) should be used in decisionServerRuntime.autoscaling\n" "" }}
    {{- end }}
    {{- if .Values.decisionServerRuntime.autoscaling.targetAverageUtilization }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.decisionServerRuntime.autoscaling.targetAverageUtilization }}
    {{- else }}
    {{- if .Values.decisionServerRuntime.autoscaling.targetAverageCpuUtilization }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.decisionServerRuntime.autoscaling.targetAverageCpuUtilization }}
    {{- end }}
    {{- end }}
    {{- if .Values.decisionServerRuntime.autoscaling.targetAverageMemoryUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.decisionServerRuntime.autoscaling.targetAverageMemoryUtilization }}
    {{- end }}
  {{- if .Values.decisionServerRuntime.autoscaling.behavior }}
  behavior:
{{ toYaml .Values.decisionServerRuntime.autoscaling.behavior | indent 4 }}
  {{- else }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  {{- end }}
{{- end }}
{{- end }}
