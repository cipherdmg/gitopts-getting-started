{{- if or .Values.decisionServerRuntime.enabled  .Values.decisionRunner.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "odm.decisionserverconsole.fullname" . }}
  labels:
    run: {{ template "odm.decisionserverconsole.fullname" . }}
{{ include "odm-additional-labels" (dict "componentName" "decisionServerConsole" "root" . "config" .Values.decisionServerConsole) | indent 4 }}
spec:
  selector:
    matchLabels:
      release: "{{ .Release.Name }}"
      run: {{ template "odm.decisionserverconsole.fullname" . }}
  {{- if or (gt (int .Values.decisionServerRuntime.replicaCount) 0) (gt (int .Values.decisionRunner.replicaCount) 0) }}
  replicas: 1
  {{- else }}
  replicas: 0
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.decisionServerConsole.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.decisionServerConsole.rollingUpdate.maxUnavailable }}
  template:
    metadata:
      labels:
        run: {{ template "odm.decisionserverconsole.fullname" . }}
{{ include "odm-additional-labels" (dict "componentName" "decisionServerConsole" "root" . "config" .Values.decisionServerConsole) | indent 8 }}
      annotations:
{{ include "odm-annotations" . | indent 8 }}
        productChargedContainers: ""
        kubectl.kubernetes.io/default-container: "odm-decisionserverconsole"
{{ include "odm-additional-annotations" (dict "root" . "config" .Values.decisionServerConsole) | indent 8 }}
    spec:
{{ include "odm-serviceAccountName" . | indent 6 }}
{{- if not (empty (.Values.decisionServerConsole.topologySpreadConstraints)) }}
      topologySpreadConstraints:
{{ toYaml .Values.decisionServerConsole.topologySpreadConstraints | indent 6 }}
{{- end }}
{{- if not (empty (.Values.decisionServerConsole.tolerations)) }}
      tolerations:
{{ toYaml .Values.decisionServerConsole.tolerations | indent 6 }}
{{- else }}
{{- if not (empty (.Values.customization.tolerations)) }}
      tolerations:
{{ toYaml .Values.customization.tolerations | indent 6 }}
{{- end }}
{{- end }}
{{- if and (not (empty .Values.customization.dedicatedNodeLabel)) (empty .Values.customization.tolerations) (empty .Values.decisionServerConsole.tolerations) }}
{{ include "odm-tolerations" . | indent 6 }}
{{- end }}
{{ include "odm-spec-security-context" . | indent 6 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          #If you specify multiple nodeSelectorTerms associated with nodeAffinity types,
          #then the pod can be scheduled onto a node if one of the nodeSelectorTerms is satisfied.
          #
          #If you specify multiple matchExpressions associated with nodeSelectorTerms,
          #then the pod can be scheduled onto a node only if all matchExpressions can be satisfied.
          #
          #valid operators: In, NotIn, Exists, DoesNotExist, Gt, Lt
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                {{- if and .Values.image.arch .Values.image.useArch }}
                - {{ .Values.image.arch }}
                {{- else }}
                - amd64
                - ppc64le
                - s390x
                {{- end }}
              {{- if and (not (empty .Values.customization.dedicatedNodeLabel)) (empty .Values.customization.tolerations) (empty .Values.decisionServerConsole.tolerations)}}
              - key: {{ .Values.customization.dedicatedNodeLabel }}
                operator: "Exists"
              {{- end }}
{{- if not (empty (.Values.decisionServerConsole.nodeAffinity)) }}
{{ toYaml .Values.decisionServerConsole.nodeAffinity | indent 14 }}
{{- else }}
{{- if not (empty (.Values.customization.nodeAffinity)) }}
{{ toYaml .Values.customization.nodeAffinity | indent 14 }}
{{- end }}
{{- end }}
{{- if not (empty (.Values.decisionServerConsole.customPodAntiAffinity)) }}
        podAntiAffinity:
{{ toYaml .Values.decisionServerConsole.customPodAntiAffinity | indent 10 }}
{{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: run
                  operator: In
                  values:
                  - {{ template "odm.decisionserverconsole.fullname" . }}
              topologyKey: "kubernetes.io/hostname"
{{- end }}
      volumes:
      {{- if and .Values.decisionServerConsole.sidecar.enabled (not (empty .Values.decisionServerConsole.sidecar.confSecretRef)) }}
      - name: sidecar-conf
        secret:
          secretName: {{ .Values.decisionServerConsole.sidecar.confSecretRef }}
          defaultMode: 0777
      {{- else }}
      {{- if and .Values.customization.sidecar.enabled (not (empty .Values.customization.sidecar.confSecretRef)) }}
      - name: sidecar-conf
        secret:
          secretName: {{ .Values.customization.sidecar.confSecretRef }}
          defaultMode: 0777
      {{- end }}
      {{- end }}
{{- if or (eq .Values.customization.vault "initcontainer") (and (.Values.vault.enabled) (eq .Values.vault.type "initcontainer")) }}
{{ include "odm-init-container-volume" (dict "initcontext" .Values.decisionServerConsole.initContainer "root" . "containername" "odm.decisionServerConsole") | indent 6 }}
{{- else -}}
{{ include "odm-db-config-volume" (dict "componentName" "decisionServer" "root" .) | indent 6 }}
{{ include "odm-oidc-context-volume" (dict "componentName" "decisionServerConsole" "root" .) | indent 6 }}
      {{- if .Values.customization.baiEmitterSecretRef }}
      - name: {{ template "odm-baiemitterconfig-secret-volume.fullname" . }}
{{- include "secret-or-spc" (dict "root" . "ref" .Values.customization.baiEmitterSecretRef) | indent 8 -}}
      {{- end }}
      {{- if .Values.customization.authSecretRef }}
      - name: {{ template "odm-auth-secret-volume.fullname" . }}
        {{- include "secret-or-spc" (dict "root" . "ref" .Values.customization.authSecretRef) | indent 8 -}}
      {{ else }}
        {{- if .Values.oidc.enabled }}
      - name: {{ template "odm-auth-secret-volume.fullname" . }}
        secret:
          secretName: {{ template "odm.oidc-auth-secret.fullname" . }}
        {{- end }}
      {{- end }}
      {{- if .Values.externalCustomDatabase.datasourceRef }}
      - name: {{ template "odm-custom-secret-ds.fullname" . }}
        {{- include "secret-or-spc" (dict "root" . "ref" .Values.externalCustomDatabase.datasourceRef) | indent 8 -}}
      {{- end }}
      {{- if .Values.externalCustomDatabase.driverPvc }}
      - name: {{ template "odm-driver-volume.fullname" . }}
        persistentVolumeClaim:
          claimName: {{ .Values.externalCustomDatabase.driverPvc }}
      {{- end }}
      {{- if .Values.decisionServerConsole.monitorRef }}
      - name: {{ template "odm.ds-console-monitor-secret.fullname" . }}
      {{- include "secret-or-spc" (dict "root" . "ref" .Values.decisionServerConsole.monitorRef) | indent 8 -}}
      {{- else }}
      {{- if .Values.customization.monitorRef }}
      - name: {{ template "odm.customization-monitor-secret.fullname" . }}
      {{- include "secret-or-spc" (dict "root" . "ref" .Values.customization.monitorRef) | indent 8 -}}
      {{- end }}
      {{- end }}
      {{- if .Values.decisionServerConsole.logstashCollectorRef }}
      - name: {{ template "odm.ds-console-logstashcollector-secret.fullname" . }}
      {{- include "secret-or-spc" (dict "root" . "ref" .Values.decisionServerConsole.logstashCollectorRef) | indent 8 -}}
      {{- else }}
      {{- if .Values.customization.logstashCollectorRef }}
      - name: {{ template "odm.customization-logstashcollector-secret.fullname" . }}
      {{- include "secret-or-spc" (dict "root" . "ref" .Values.customization.logstashCollectorRef) | indent 8 -}}
      {{- end }}
      {{- end }}
      {{- if not (empty .Values.decisionServerConsole.libertyHookRef) }}
      - name: {{ template "odm.ds-console-liberty-hook-secret.fullname" . }}
        secret:
          secretName: {{ .Values.decisionServerConsole.libertyHookRef }}
      {{- else }}
      {{- if not (empty .Values.customization.libertyHookRef) }}
      - name: {{ template "odm.customization-liberty-hook-secret.fullname" . }}
        secret:
          secretName: {{ .Values.customization.libertyHookRef }}
      {{- end }}
      {{- end }}
{{- end }}
{{ include "odm-sql-internal-db-check-volume" . | indent 6 }}
{{ include "odm-readonlyfs-volumes-context" . | indent 6 }}
{{ include "odm-dba-volumes-context" . | indent 6 }}
{{ include "odm-db-ssl-volumes-context" (dict "root" . "componentName" "decisionServer") | indent 6 }}
{{ include "odm-security-volume" . | indent 6 }}
      - name: {{ template "odm-logging-volume.fullname" . }}
        configMap:
      {{- if not (empty .Values.decisionServerConsole.loggingRef) }}
          name: {{ .Values.decisionServerConsole.loggingRef }}
      {{ else }}
          name: {{ template "odm.ds-console-logging-configmap.fullname" . }}
      {{- end }}
          items:
           - key: dsc-logging
             path: logging.xml
      - name: {{ template "odm-jvm-options-volume.fullname" . }}
        configMap:
      {{- if not (empty .Values.decisionServerConsole.jvmOptionsRef ) }}
          name: {{ .Values.decisionServerConsole.jvmOptionsRef }}
      {{ else }}
          name: {{ template "odm.ds-console-jvm-options-configmap.fullname" . }}
      {{- end }}
          items:
           - key: dsc-jvm-options
             path: jvm.options
      {{- if not (empty .Values.decisionServerConsole.lifecycleHooksSecretRef) }}
      - name: lifecycle-hooks-secret
        secret:
          secretName: {{ .Values.decisionServerConsole.lifecycleHooksSecretRef }}
          defaultMode: 0777
      {{- end }}
      {{- if not (empty .Values.decisionServerConsole.customScriptsRef) }}
      - name: {{ template "odm.ds-console-custom-scripts-configmap.fullname" . }}
        configMap:
          name: {{ .Values.decisionServerConsole.customScriptsRef }}
          defaultMode: 0777
      {{- else }}
      {{- if not (empty .Values.customization.customScriptsRef) }}
      - name: {{ template "odm.customization-custom-scripts-configmap.fullname" . }}
        configMap:
          name: {{ .Values.customization.customScriptsRef }}
          defaultMode: 0777
      {{- end }}
      {{- end }}
      - name: {{ template "odm-ds-console-runtime-webconfigref-volume.fullname" . }}
        configMap:
      {{- if not (empty (.Values.decisionServerConsole.runtime.webConfigRef)) }}
          name: {{ .Values.decisionServerConsole.runtime.webConfigRef }}
      {{ else }}
      {{- if not (empty (.Values.decisionServerRuntime.webConfigRef)) }}
          name: {{ .Values.decisionServerRuntime.webConfigRef }}
      {{ else }}
          name: {{ template "odm.ds-runtime-web-configmap.fullname" . }}
      {{- end}}
      {{- end}}
      - name: {{ template "odm-ds-console-webconfigref-volume.fullname" . }}
        configMap:
      {{- if not (empty .Values.decisionServerConsole.webConfigRef ) }}
          name: {{ .Values.decisionServerConsole.webConfigRef }}
      {{ else }}
          name: {{ template "odm.ds-console-web-configmap.fullname" . }}
      {{- end }}
{{- if and .Values.customization.ephemeralStorage (or (not (empty .Values.customization.ephemeralStorage.definition)) (not (empty .Values.customization.ephemeralStorage.className))) }}
{{ include "odm-ephemeral-volume-definition" . | indent 6 }}
{{ else }}
      - name: lib-workarea-volume
        emptyDir: {}
{{- end }}
{{ include "odm-trusted-cert-volume" . | indent 6 }}
{{ include "odm-private-cert-volume" . | indent 6 }}
      initContainers:
      {{- if .Values.customization.readOnlyRootFilesystem }}
      - name: init-folder-readonlyfs
{{ include "image.tagOrDigest" (dict "containerName" "odm-decisionserverconsole" "containerTag" .Values.decisionServerConsole.tagOrDigest "root" .) | indent 8 }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
{{ include "odm-initcontainer-readonlyfs" . | indent 8 }}
      {{- end }}
      {{- if or (eq .Values.customization.vault "initcontainer") (and (.Values.vault.enabled) (eq .Values.vault.type "initcontainer")) }}
{{ include "odm-init-container-template-full" (dict "initcontext" .Values.decisionServerConsole.initContainer "root" . "containername" "odm.decisionServerConsole" )  | indent 6 }}
      {{- end -}}
      {{- if eq (include "isInternalDatabase" .) "true" }}
      - name: init-decisionserverconsole
{{ include "image.tagOrDigest" (dict "containerName" "dbserver" "containerTag" .Values.internalDatabase.tagOrDigest "root" .) | indent 8  }}
{{ include "odm-security-context" . | indent 8 }}
        command: ['/usr/local/bin/checkdb.sh']
        env:
{{ include "odm-sql-internal-db-check-env" . | indent 8 }}
        volumeMounts:
{{ include "odm-sql-internal-db-check-volume-mount" . | indent 8 }}
        resources:
{{ include "odm-sql-internal-db-check-resources" . | indent 10 }}
      {{- end }}
{{ include "odm-dba-context" . | indent 6 }}
      containers:
      - name: odm-decisionserverconsole
{{ include "image.tagOrDigest" (dict "containerName" "odm-decisionserverconsole" "containerTag" .Values.decisionServerConsole.tagOrDigest "root" .) | indent 8  }}
        {{- if not (empty .Values.decisionServerConsole.lifecycleHooksSecretRef) }}
{{ include "odm-lifecyclehook" . | indent 8 }}
        {{- end }}
{{ include "odm-security-context" . | indent 8 }}
        {{- if or (not .Values.customization.readOnlyRootFilesystem) (eq .Values.image.pullPolicy "Never") }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- end }}
        volumeMounts:
        {{- if or (eq .Values.customization.vault "initcontainer") (and (.Values.vault.enabled) (eq .Values.vault.type "initcontainer")) }}
{{ include "odm-init-container-volume-mount" . | indent 8 }}
        {{- else -}}
{{ include "odm-db-config-volume-mount" . | indent 8 }}
{{ include "odm-oidc-context-volume-mount" (dict "componentName" "decisionServerConsole" "root" .) | indent 8 }}
        {{- end}}
{{ include "odm-volumemounts-readonlyfs-context" . | indent 8 }}
{{ include "odm-dba-volumemounts-context" . | indent 8 }}
{{ include "odm-db-ssl-volumemounts-context" (dict "root" . "componentName" "decisionServer") | indent 8 }}
{{ include "odm-trusted-cert-volume-mount" . | indent 8 }}
{{ include "odm-private-cert-volume-mount" . | indent 8 }}
{{ include "odm-security-volumemounts-context" . | indent 8 }}
        {{- if not (empty (.Values.customization.baiEmitterSecretRef)) }}
        {{- if or (eq .Values.customization.vault "initcontainer") (and (.Values.vault.enabled) (eq .Values.vault.type "initcontainer")) }}
        - {{- include "odm-ephemeral-volume-mount" (dict "root" . "volumeName" (printf "%s" (include "odm-baiemitterconfig-secret-volume.fullname" .)) "subPath" "baiemitter") | nindent 10 }}
          mountPath: {{ template "odm-baiemitterconfig-dir" . }}
        {{- else }}
        - name: {{ template "odm-baiemitterconfig-secret-volume.fullname" . }}
          mountPath: {{ template "odm-baiemitterconfig-dir" . }}
        {{- end }}
        {{- end}}
        {{- if or (not (empty (.Values.customization.authSecretRef))) (and (.Values.oidc.enabled) (empty (.Values.customization.authSecretRef))) }}
        {{- if or (eq .Values.customization.vault "initcontainer") (and (.Values.vault.enabled) (eq .Values.vault.type "initcontainer")) }}
        - {{- include "odm-ephemeral-volume-mount" (dict "root" . "volumeName" (printf "%s" (include "odm-auth-secret-volume.fullname" .)) "subPath" "auth") | nindent 10 }}
          mountPath: {{ template "odm-auth-dir" . }}
        {{- else }}
        - name: {{ template "odm-auth-secret-volume.fullname" . }}
          mountPath: {{ template "odm-auth-dir" . }}
        {{- end }}
        {{- end}}
        {{- if not (empty (.Values.externalCustomDatabase.datasourceRef)) }}
        {{- if or (eq .Values.customization.vault "initcontainer") (and (.Values.vault.enabled) (eq .Values.vault.type "initcontainer")) }}
        - {{- include "odm-ephemeral-volume-mount" (dict "root" . "volumeName" (printf "%s" (include "odm-custom-secret-ds.fullname" .)) "subPath" "customdatasource") | nindent 10 }}
          mountPath: {{ template "odm-customdatasource-dir" . }}
        {{- else }}
        - name: {{ template "odm-custom-secret-ds.fullname" . }}
          mountPath: {{ template "odm-customdatasource-dir" . }}
        {{- end }}
        {{- end}}
        {{- if not (empty (.Values.externalCustomDatabase.driverPvc)) }}
        {{- if or (eq .Values.customization.vault "initcontainer") (and (.Values.vault.enabled) (eq .Values.vault.type "initcontainer")) }}
        - {{- include "odm-ephemeral-volume-mount" (dict "root" . "volumeName" (printf "%s" (include "odm-driver-volume.fullname" .)) "subPath" "jdbcdrivers") | nindent 10 }}
          mountPath: {{ template "odm-driver-dir" . }}
        {{- else }}
        - name: {{ template "odm-driver-volume.fullname" . }}
          mountPath: {{ template "odm-driver-dir" . }}
        {{- end }}
        {{- end}}
        - name: {{ template "odm-logging-volume.fullname" . }}
          mountPath: {{ template "odm-log-dir" . }}
        - name: {{ template "odm-jvm-options-volume.fullname" . }}
          mountPath: {{ template "odm-jvm-options-dir" . }}
        - {{- include "odm-ephemeral-volume-mount" (dict "root" . "volumeName" "lib-workarea-volume" "subPath" "lib-workarea") | nindent 10 }}
          mountPath: /opt/ibm/wlp/output/defaultServer/workarea
        - name: {{ template "odm-ds-console-webconfigref-volume.fullname" . }}
          readOnly: true
          mountPath: /opt/ibm/wlp/usr/servers/defaultServer/res/web-configuration.properties
          subPath: web-configuration.properties
        - name: {{ template "odm-ds-console-runtime-webconfigref-volume.fullname" . }}
          readOnly: true
          mountPath: /opt/ibm/wlp/usr/servers/defaultServer/web-configuration.properties
          subPath: web-configuration.properties
        {{- if not (empty .Values.decisionServerConsole.customScriptsRef) }}
        - name: {{ template "odm.ds-console-custom-scripts-configmap.fullname" . }}
          mountPath: /script/customStart.sh
          subPath: customStart.sh
        - name: {{ template "odm.ds-console-custom-scripts-configmap.fullname" . }}
          mountPath: /script/customEnd.sh
          subPath: customEnd.sh
        {{- else}}
        {{- if not (empty (.Values.customization.customScriptsRef)) }}
        - name: {{ template "odm.customization-custom-scripts-configmap.fullname" . }}
          mountPath: /script/customStart.sh
          subPath: customStart.sh
        - name: {{ template "odm.customization-custom-scripts-configmap.fullname" . }}
          mountPath: /script/customEnd.sh
          subPath: customEnd.sh
        {{- end}}
        {{- if not (empty (.Values.decisionServerConsole.lifecycleHooksSecretRef)) }}
        - name: lifecycle-hooks-secret
          mountPath: /opt/ibm/wlp/usr/servers/defaultServer/lifecycleHook
        {{- end}}
        {{- end}}
        {{- if not (empty .Values.decisionServerConsole.monitorRef) }}
        - name: {{ template "odm.ds-console-monitor-secret.fullname" . }}
          mountPath: {{ template "odm-secrets-monitor-dir" . }}
        {{- else}}
        {{- if not (empty (.Values.customization.monitorRef)) }}
        - name: {{ template "odm.customization-monitor-secret.fullname" . }}
          mountPath: {{ template "odm-secrets-monitor-dir" . }}
        {{- end}}
        {{- end}}
        {{- if not (empty .Values.decisionServerConsole.logstashCollectorRef) }}
        - name: {{ template "odm.ds-console-logstashcollector-secret.fullname" . }}
          mountPath: {{ template "odm-secrets-logstashcollector-dir" . }}
        {{- else}}
        {{- if not (empty (.Values.customization.logstashCollectorRef)) }}
        - name: {{ template "odm.customization-logstashcollector-secret.fullname" . }}
          mountPath: {{ template "odm-secrets-logstashcollector-dir" . }}
        {{- end}}
        {{- end}}
        {{- if not (empty .Values.decisionServerConsole.libertyHookRef) }}
        - name: {{ template "odm.ds-console-liberty-hook-secret.fullname" . }}
          mountPath: {{ template "odm-secrets-liberty-hook-dir" . }}
        {{- else}}
        {{- if not (empty (.Values.customization.libertyHookRef)) }}
        - name: {{ template "odm.customization-liberty-hook-secret.fullname" . }}
          mountPath: {{ template "odm-secrets-liberty-hook-dir" . }}
        {{- end}}
        {{- end}}
        env:
{{ include "odm-db-config"  (dict "componentName" "decisionServer" "root" .) | indent 10 }}
{{ include "odm-metering-config" . | indent 10 }}
          - name: "RELEASE_NAME"
            value: {{ .Release.Name }}
          {{- if not (empty (.Values.decisionServerConsole.title)) }}
          - name: COM_IBM_ODM_RES_CONSOLE_PAGE_TITLE
            value: "{{ .Values.decisionServerConsole.title }}"
          {{- end }}
          {{- if not (empty (.Values.decisionServerConsole.description)) }}
          - name: COM_IBM_ODM_RES_CONSOLE_DESCRIPTION
            value: "{{ .Values.decisionServerConsole.description }}"
          {{- end }}
          {{- if and (not (empty .Values.decisionServerConsole.extendRoleMapping )) (.Values.decisionServerConsole.extendRoleMapping) }}
          - name: "DSC_ROLE_GROUP_MAPPING"
            value: "true"
          {{- end }}
          {{- if (not (empty .Values.decisionServerConsole.contextRoot )) }}
          - name: "ODM_CONTEXT_ROOT"
            value: "{{ .Values.decisionServerConsole.contextRoot}}"
          {{- end }}
          {{- if .Values.service.ingress.enabled }}
          - name: "DECISION_SERVICE_URL"
            value: "{{ .Values.decisionServerRuntime.contextRoot}}/DecisionService"
          {{- else }}
          - name: "DECISION_SERVICE_URL"
            value: "{{ .Values.decisionServerConsole.contextRoot}}/DecisionService"
          {{- end }}
          {{- if .Values.service.enableTLS }}
          - name: "ENABLE_TLS"
            value: "true"
          {{- end }}
          {{- if .Values.customization.disableWSJavaAgent }}
          - name: "WLP_SKIP_BOOTSTRAP_AGENT"
            value: "true"
          {{- end }}
          - name: "ENABLE_FIPS"
            value: "{{ .Values.customization.enableFips }}"
          {{- if .Values.dba.istio.enabled }}
          - name: "ENABLE_ISTIO"
            value: "true"
          {{- end }}
          {{- if or .Values.customization.enableAuditLog .Values.decisionServerConsole.enableAuditLog }}
          - name: "ENABLE_AUDIT"
            value: "true"
          {{- end }}
          {{- if or .Values.customization.enableMutualTLS .Values.decisionServerConsole.enableMutualTLS }}
          - name: "ENABLE_MTLS"
            value: "true"
          {{- end }}
{{ include "odm-liberty-gc-env" . | indent 10 }}
{{ include "odm-kubeVersion" . | indent 10 }}
{{ include "odm-oidc-context" (dict "componentName" "decisionServerConsole" "root" .) | indent 10 }}
{{ include "odm-dba-production" . | indent 10 }}
{{ include "odm-users-password-env" . | indent 10 }}
{{ include "odm-enabled-ciphers" . | indent 10 }}
{{ include "odm-download" (dict "containerParameters" .Values.decisionServerConsole "root" .) | indent 10 }}
        ports:
        {{- if .Values.service.enableTLS}}
        - name: dsc-port
          containerPort: 9443
        {{- if .Values.dba.istio.enabled }}
        - name: dsc-port-http
          containerPort: 9080
        {{- end }}
        {{- else }}
        - name: dsc-port
          containerPort: 9080
        {{- end }}
        - containerPort: 1883
{{ include "odm-probe-container-template" (dict "root" . "componentPath" "res/login.jsp" "port" "dsc-port" "containerParameters" .Values.decisionServerConsole )  | indent 8 }}
        resources:
{{ toYaml .Values.decisionServerConsole.resources | indent 10 }}
      {{- if or .Values.customization.sidecar.enabled  .Values.decisionServerConsole.sidecar.enabled }}
      - name: sidecar
        {{- if and .Values.decisionServerConsole.sidecar.enabled (not (empty .Values.decisionServerConsole.sidecar.image)) }}
        image: {{ .Values.decisionServerConsole.sidecar.image }}
        {{ else }}
        {{- if and .Values.customization.sidecar.enabled (not (empty .Values.customization.sidecar.image)) }}
        image: {{ .Values.customization.sidecar.image }}
        {{ else }}
{{ include "image.tagOrDigest" (dict "containerName" "odm-decisionserverconsole" "containerTag" .Values.decisionServerConsole.tagOrDigest "root" .) | indent 8  }}
        {{- end }}
        {{- end }}
{{ include "odm-security-context" . | indent 8 }}
        {{- if or (not .Values.customization.readOnlyRootFilesystem) (eq .Values.image.pullPolicy "Never") }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- end }}
        command: ['{{ template "odm-sidecar-dir" . }}/sidecar-start.sh']
        volumeMounts:
        {{- if or (and .Values.customization.sidecar.enabled (not (empty .Values.customization.sidecar.confSecretRef))) (and .Values.decisionServerConsole.sidecar.enabled (not (empty .Values.decisionServerConsole.sidecar.confSecretRef))) }}
        - name: sidecar-conf
