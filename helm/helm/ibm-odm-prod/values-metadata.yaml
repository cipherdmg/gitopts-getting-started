## License parameter
license:
  __metadata:
    label: "License"
    description: "Please read and accept the license agreement"
    type: "boolean"
    required: true

usersPassword:
  __metadata:
    label: "Users Password"
    description: "Specify the password for odm default users. This parameter is required if authSecretRef is not set."
    type: "string"
    required: false

## Image parameters
image:
  __metadata:
    label: "Images"
    description: "The Docker images parameters;"
  repository:
    __metadata:
      label: "Repository"
      description: "Specify the repository used to retrieve the Docker images if you do not want to use the default one."
      type: "string"
      required: false
  tag:
    __metadata:
      label: "Tag"
      description: "Specify the tag for the Docker images."
      type: "string"
      required: true
  pullPolicy:
    __metadata:
      label: "Pull policy"
      description: "Specify the pull policy for the Docker images."
      type: "string"
      required: true
      options:
        -
          label: "If not present"
          value: "IfNotPresent"
        -
          label: "Always"
          value: "Always"
        -
          label: "Never"
          value: "Never"
## Optionally specify an array of imagePullSecrets.
## Secrets must be manually created in the namespace.
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
##  - admin.registrykey
  pullSecrets:
    __metadata:
      label: "Pull secrets"
      description: "Specify the pull secrets for the Docker images."
      type: "string"
      required: false
## Architecture - e.g. amd64, ppc64le. Deprecated.
  arch:
    __metadata:
      label: "Architecture"
      description: "Specify the architecture for the Docker images. The architecture is based on the master node. Choose another architecture to overwrite it."
      type: "string"
      required: false
      options:
        -
          label: "AMD64"
          value: "amd64"
        -
          label: "PPC64LE"
          value: "ppc64le"
        -
          label: "s390x"
          value: "s390x"
  useArch:
    __metadata:
      label: "Use image.arch"
      description: "Specify whether to use image.arch. If true, image.arch value will be added to image.tag to specify to full image name to pull."
      type: "boolean"
      required: false

## Service parameters
service:
  __metadata:
    label: "Service"
    description: "The service parameters."
  enableTLS:
    __metadata:
      label: "Enable TLS"
      description: "Specify whether to enable Transport Layer Security. If true, ODM web apps are accessed through HTTPS. If false, they are accessed through HTTP."
      type: "boolean"
      required: true
  enableRoute:
    __metadata:
      label: "Enable Route"
      description: "Specify whether we should create Openshift routes automaticaly. If true, the routes are created for all ODM components. "
      type: "boolean"
      required: true
  hostname:
    __metadata:
      label: "Route Hostname"
      description: "Specify the hostname used by the created routes."
      type: "string"
      required: false
  type:
    __metadata:
      label: "Type"
      description: "Specify the service type."
      type: "string"
      required: true
      options:
        -
          label: "Node port"
          value: "NodePort"
        -
          label: "Cluster IP"
          value: "ClusterIP"
  ipFamilies:
    __metadata:
      label: "IP Families"
      description: "When using IPV6, IPV4 dual stacks. Specify the kind of stacks. IPv4 and/or IPv6."
      type: "string"
      required: false
      options:
        -
          label: "IPv4"
          value: "IPv4"
        -
          label: "IPv6"
          value: "IPv6"
  ipFamilyPolicy:
    __metadata:
      label: "IP FamilyPolicy"
      description: "When using IPV6, IPV4 dual stacks. Specify the policy of the stack. "
      type: "string"
      required: false
      options:
        -
          label: "Single Stack"
          value: "SingleStack"
        -
          label: "Prefer Dual Stack"
          value: "PreferDualStack"
        -
          label: "Require Dual Stack"
          value: "RequireDualStack"
  ingress:
    enabled:
      __metadata:
        label: "Enable Ingress"
        description: "Specify whether we should create ingress automaticaly. If true, the ingress are created for all ODM components. "
        type: "boolean"
        required: false
    annotations:
      __metadata:
        label: "Ingress Annotations"
        description: "Specify the Ingress annotations."
        type: "string"
        required: false
    class:
      __metadata:
        label: "Ingress class name"
        description: "Specify the name of the Ingress class."
        type: "string"
        required: false
    tlsHosts:
      __metadata:
        label: "TLS Ingress Hosts"
        description: "Specify the TLS domains of the ingress."
        type: "string"
        required: false
    tlsSecretRef:
      __metadata:
        label: "TLS Ingress secret reference"
        description: "Specify the name of the secret that contains the TLS certificate you want to use for the Ingress Domain."
        type: "string"
        required: false
    host:
      __metadata:
        label: "Ingress host"
        description: "Specify the name of the Ingress Domain."
        type: "string"
        required: false

## ServiceAccount parameters
serviceAccountName:
  __metadata:
    label: "ServiceAccount name"
    description: "Specify ServiceAccount to use in Kubernetes."
    type: "string"
    required: false

## Decision Server Runtime parameters
decisionServerRuntime:
  __metadata:
    label: "Decision Server Runtime"
    description: "The Decision Server Runtime parameters."
  enabled:
    __metadata:
      label: "Enabled"
      description: "Specify whether to enable Decision Server Runtime."
      type: "boolean"
      required: true
  # dedicated is a list of dicts with the following contents:
  # - name: "<servicename>" (mandatory)
  #   paths: [] (mandatory)
  #   resources: {} (optional, same format as decisionServerRuntime.resources below)
  #   webConfigRef: "" (optional)
  #   xuConfigRef: "" (optional)
  dedicated:
    __metadata:
      label: "Multi-service"
      description: "Specify whether to dedicate Decision Server Runtime pods to specific rulesets."
      type: "string"
      required: false
  tagOrDigest:
    __metadata:
      label: "Tag or Digest"
      description: "Specify the tag or digest for the Decision Server Runtime Docker image."
      type: "string"
      required: false
  replicaCount:
    __metadata:
      label: "Replica count"
      description: "Specify the number of Decision Server Runtime pods."
      type: "number"
      required: true
  loggingRef:
    __metadata:
      label: "Logging options"
      description: "Specify the name of the configMap the wanted logging options. If left empty, default logging options are used."
      type: "string"
      required: false
  jvmOptionsRef:
    __metadata:
      label: "JVM options"
      description: "Specify the name of the configMap the wanted JVM options. If left empty, default JVM options are used."
      type: "string"
      required: false
  monitorRef:
    __metadata:
      label: "mpMetrics monitoring options"
      description: "Specify the name of the secret to configure the mpMetrics monitoring. If left empty, there is no mpMetric monitoring."
      type: "string"
      required: false
  logstashCollectorRef:
    __metadata:
      label: "logstash collector configuration"
      description: "Specify the name of the secret to configure the logstash collector. If left empty, there is no logstash collector configuration."
      type: "string"
      required: false
  libertyHookRef:
    __metadata:
      label: "custom liberty start/end configuration"
      description: "Specify the name of the secret to configure the liberty start and/or end. If left empty, there is no custom liberty start/end."
      type: "string"
      required: false
  xuConfigRef:
      __metadata:
        label: "XU configuration configmap reference"
        description: "Specify the name of the configmap that contains the XU configuration property file."
        type: "string"
        required: false
  webConfigRef:
      __metadata:
        label: "Web.xml configuration configmap reference"
        description: "Specify the name of the configmap that contains the Web.xml context-param and filter's init-param configuration property file."
        type: "string"
        required: false
  lifecycleHooksSecretRef:
        __metadata:
        label: "Kubernetes hook lifecycle Injection"
        description: "Specify the name of the Kubernetes Secret that contains scripts for the container lifecycle hooks. The secret might have start.sh, stop.sh keys to be run in the postStart, preStop lifecycle."
        type: "string"
        required: false
        hidden: false
  customScriptsRef:
      __metadata:
        label: "Custom Scripts Injection"
        description: "Specify the name of the configmap allowing to inject customStart.sh and customEnd.sh scripts."
        type: "string"
        required: false
        hidden: true
  extendRoleMapping:
    __metadata:
      label: "Extend Role Mapping"
      description: "Specify whether to enable the role group mapping extension."
      type: "boolean"
      required: false
  contextRoot:
    __metadata:
      label: "Application context-root"
      description: "Specify the Decision Server Runtime context-root."
      type: "string"
      required: false
  enableTLSAuth:
    __metadata:
      label: "Enable HTTPS Client Authentication"
      description: "Enable HTTPS Client Authentication in Decision Server Runtime."
      type: "boolean"
      required: false
  initContainer:
    image:
      __metadata:
        label: "InitContainer Image"
        description: "Specify the initContainer image to use."
        type: "string"
        required: false
    command:
      __metadata:
        label: "Array of commands"
        description: "Specify the commands launched by the initContainer."
        type: "string"
        required: false
    configRef:
      __metadata:
        label: "Name of the Configmap for the initContainer"
        description: "Specify the name of the configmap to be used by the initContainer."
        type: "string"
        required: false
    configOidcRef:
      __metadata:
        label: "Name of the Oidc Template Configmap for the initContainer"
        description: "Specify the name of the Oidc template configmap to be used by the initContainer."
        type: "string"
        required: false
    resources:
      requests:
        cpu:
          __metadata:
            label: "CPU request"
            description: "Specify the requested CPU."
            type: "string"
            required: true
        memory:
          __metadata:
            label: "Memory request"
            description: "Specify the requested memory."
            type: "string"
            required: true
      limits:
        cpu:
          __metadata:
            label: "CPU limit"
            description: "Specify the CPU limit."
            type: "string"
            required: true
        memory:
          __metadata:
            label: "Memory limit"
            description: "Specify the memory limit."
            type: "string"
            required: true
    existingClaimName:
      __metadata:
        label: "Name of the PVC for the initContainer"
        description: "Specify the name of the PVC to be used by the initContainer."
        type: "string"
        required: false
    env:
      __metadata:
        label: "List of environment variables"
        description: "List of key/value pairs that will declare as environment variables on the initContainer."
        type: "string"
        required: false
  resources:
    requests:
      cpu:
        __metadata:
          label: "CPU request"
          description: "Specify the requested CPU."
          type: "string"
          required: true
      memory:
        __metadata:
          label: "Memory request"
          description: "Specify the requested memory."
          type: "string"
          required: true
      ephemeral-storage:
        __metadata:
          label: "Ephemeral Storage request"
          description: "Specify the requested local ephemeral storage."
          type: "string"
          required: true
    limits:
      cpu:
        __metadata:
          label: "CPU limit"
          description: "Specify the CPU limit."
          type: "string"
          required: true
      memory:
        __metadata:
          label: "Memory limit"
          description: "Specify the memory limit."
          type: "string"
          required: true
      ephemeral-storage:
        __metadata:
          label: "Ephemeral Storage limit"
          description: "Specify the local ephemeral storage limit."
          type: "string"
          required: true
  autoscaling:
    enabled:
      __metadata:
        label: "Autoscaling enabled"
        description: "Specify whether to enable autoscaling for Decision Server Runtime."
        type: "boolean"
        required: false
    minReplicas:
      __metadata:
        label: "Mimium number of replicas"
        description: "Specify the minimum number of replicas."
        type: "string"
        required: false
    maxReplicas:
      __metadata:
        label: "Maximum number of replicas"
        description: "Specify the maximum number of replicas."
        type: "string"
        required: false
    targetAverageCpuUtilization:
      __metadata:
        label: "Target average utilization of the CPU"
        description: "Specify the target average utilization (in percentage of cpu utilization)."
        type: "string"
        required: false
    targetAverageMemoryUtilization:
      __metadata:
        label: "Target average utilization of the Memory"
        description: "Specify the target average utilization (in percentage of memory utilization)."
        type: "string"
        required: false
    behavior:
      __metadata:
        label: "Optional parameters"
        description: "Specify how pods scale up and down"
        type: "dictionary"
        required: false
  nodeAffinity:
    __metadata:
      label: "nodeAffinity node selector term match expression list"
      description: "Specify the node selector term match expression list to manage node affinity."
      type: "string"
      required: false
  customPodAntiAffinity:
    __metadata:
      label: "Custom PodAntiAffinity pod selector and topology key rule list"
      description: "Specify the pod selector and topology key rules to manage pod anti-affinity."
      type: "string"
      required: false
  podDisruptionBudget:
      __metadata:
      label: "PodDisruptionBudget minAvailable or maxUnavailable definition"
      description: "Specify the minAvailable or maxUnavailable definition of the pod disruption budget."
      type: "string"
      required: false
  tolerations:
    __metadata:
      label: "Tolerations"
      description: "Specify tolerations to allow the scheduler to schedule pods onto nodes with matching taints."
      type: "string"
      required: false
  topologySpreadConstraints:
    __metadata:
      label: "Topology spread constraints"
      description: "Specify topology spread constraints to control how pods are spread across the cluster."
      type: "string"
      required: false
  labels:
    __metadata:
      label: "Custom labels"
      description: "Specify the labels to add to Decision Server Runtime deployment."
      type: "string"
      required: false
  annotations:
    __metadata:
      label: "Custom Annotations"
      description: "Specify the annotations to add to Decision Server Runtime pods."
      type: "string"
      required: false
  networkPolicy:
    egress:
      __metadata:
        label: "Egress NetworkPolicy"
        description: "Specify the Decision Server Runtime egress network policy."
        type: "string"
        required: false
    ingress:
      __metadata:
        label: "Ingress NetworkPolicy"
        description: "Specify the Decision Server Runtime ingress network policy."
        type: "string"
        required: false
  ## Optionally specify a list of downloadUrl using --set decisionServerRuntime.downloadUrl="{url1,url2}"
  downloadUrl:
    __metadata:
      label: "Downloadable urls"
      description: "Specify the url of download. You can specify a list of urls. Files with .zip, .tar.gz, .tar.bz2, .tgz extensions will be automatically unarchived after their downloads"
      type: "string"
      required: false
  enableAuditLog:
    __metadata:
      label: "Enable Audit Logging"
      description: "Enable Audit Logging in Decision Server Runtime."
      type: "boolean"
      required: false
  enableMutualTLS:
    __metadata:
      label: "Enable mutual TLS"
      description: "Enable mutual TLS in Decision Server Runtime."
      type: "boolean"
      required: false
  routeName:
    __metadata:
      label: "Decision Server Runtime Route Hostname"
      description: "Specify the hostname used by the Decision Server Runtime route."
      type: "string"
      required: false
  sidecar:
    enabled:
      __metadata:
        label: "Enable Sidecar Container"
        description: "Enable Sidecar Container in Decision Server Runtime."
        type: "boolean"
        required: false
    image:
      __metadata:
        label: "Sidecar Image"
        description: "Specify the sidecar image to use."
        type: "string"
        required: false
    confSecretRef:
      __metadata:
        label: "Name of the Secret for the sidecar"
        description: "Specify the name of the secret to be used by the sidecar container."
        type: "string"
        required: false
    resources:
      __metadata:
        label: "Sidecar Resources"
        description: "Specify the sidecar resources."
        type: "string"
        required: false
    probes:
      __metadata:
        label: "Sidecar Probes"
        description: "Specify the sidecar probes (startupProbe,readinessProbe,livenessProbe)."
        type: "string"
        required: false
  rollingUpdate:
    maxSurge:
      __metadata:
        label: "Maximum number of additional pods"
        description: "Specify the number of pods that can be created above the desired replica count during an update."
        type: "string"
        required: false
    maxUnavailable:
      __metadata:
        label: "Maximum number of pods unavailable"
        description: "Specify the number of pods that can be unavailable during an update."
        type: "string"
        required: false  

