# OpenId
oidc:
  __metadata:
    label: "OpenId"
    description: "The OpenId parameters"
  enabled:
    __metadata:
      label: "Enabled"
      description: "Specify whether to enable OpenId Authentication."
      type: "boolean"
      required: true
  ## Optionally restrict OIDC only to the components listed, eg. --set oidc.applyToComponents="{decisionServerConsole,decisionServerRuntime}"
  applyToComponents:
    __metadata:
      label: "Components in which OIDC should be enabled"
      description: "Specify the components in which OIDC should be enabled (all by default). Specify a list with elements such as decisionCenter, decisionRunner, decisionServerConsole, decisionServerRuntime."
      type: "list"
      required: false
  mode:
    __metadata:
      label: "OIDC Authentication Mode"
      description: "The OIDC Authentication Mode can be PKCE or PRIVATE_KEY_JWT"
      type: "string"
      required: false
  keyAliasName:
    __metadata:
      label: "The Alias Name of the Private Key used with PRIVATE_KEY_JWT mode"
      description: "The Alias Name of the Private Key used with PRIVATE_KEY_JWT mode"
      type: "string"
      required: false
  serverUrl:
    __metadata:
      label: "OIDC Server URL"
      description: "The OIDC Server URL"
      type: "string"
      required: false
  registrationUrl:
    __metadata:
      label: "OIDC Registration URL"
      description: "The OIDC URL to register URI redirects"
      type: "string"
      required: false
  adminRef:
    __metadata:
      label: "OIDC Admin Secret reference"
      description: "Specify the name of the secret that contains the admin username and password to connect to the OpenId Server."
      type: "string"
      required: false
  redirectUrisRef:
    __metadata:
      label: "OIDC Redirect Uris Config Map"
      description: "Specify the name of the configMap providing OIDC Redirect Uris"
      type: "string"
      required: false
  clientRef:
    __metadata:
      label: "OIDC Client Secret reference"
      description: "The secret containing the client id and password to register to the OpenId Server. Left empty, it generates a default clientId and clientSecret"
      type: "string"
      required: false
  disableLoginPanel:
    __metadata:
      label: "Disable Basic Auth Login Panel"
      description: "Specify whether to disable the Basic Auth Login Panel."
      type: "boolean"
      required: false
  provider:
    __metadata:
      label: "OIDC Provider name"
      description: "The OIDC Provider name. If not provided, the default name is ums"
      type: "string"
      required: false
  allowedDomains:
    __metadata:
      label: "OIDC Allowed Domains"
      description: "The list of domains allowed to access the Decision Center and RES console"
      type: "string"
      required: false
  initContainer:
    image:
      __metadata:
        label: "InitContainer Image"
        description: "Specify the initContainer image to use."
        type: "string"
        required: false
    command:
      __metadata:
        label: "Array of commands"
        description: "Specify the commands launched by the initContainer."
        type: "string"
        required: false
    configRef:
      __metadata:
        label: "Name of the Configmap for the initContainer"
        description: "Specify the name of the configmap to be used by the initContainer."
        type: "string"
        required: false
    resources:
      requests:
        cpu:
          __metadata:
            label: "CPU request"
            description: "Specify the requested CPU."
            type: "string"
            required: true
        memory:
          __metadata:
            label: "Memory request"
            description: "Specify the requested memory."
            type: "string"
            required: true
      limits:
        cpu:
          __metadata:
            label: "CPU limit"
            description: "Specify the CPU limit."
            type: "string"
            required: true
        memory:
          __metadata:
            label: "Memory limit"
            description: "Specify the memory limit."
            type: "string"
            required: true
    existingClaimName:
      __metadata:
        label: "Name of the PVC for the initContainer"
        description: "Specify the name of the PVC to be used by the initContainer."
        type: "string"
        required: false
    env:
      __metadata:
        label: "List of environment variables"
        description: "List of key/value pairs that will declare as environment variables on the initContainer."
        type: "string"
        required: false

