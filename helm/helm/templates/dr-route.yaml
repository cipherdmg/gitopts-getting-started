{{- if and .Values.decisionRunner.enabled .Values.service.enableRoute }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{  template "odm-dr-route.fullname" . }}
  labels:
{{ include "odm-additional-labels" (dict "componentName" "decisionRunner" "root" .) | indent 4 }}
spec:
  {{- if not (empty .Values.decisionRunner.routeName ) }}
  host: {{ .Values.decisionRunner.routeName }}
  {{ else }}
  {{- if not (empty .Values.service.hostname) }}
  host: decisionrunner.odm.{{ .Release.Name }}.{{ .Values.service.hostname }}
  {{- end }}
  {{- end }}
  port:
  {{- if .Values.service.enableTLS }}
    targetPort: decisionrunner-https
  tls:
    termination: passthrough
  {{ else }}
    targetPort: decisionrunner
  {{- end }}
  to:
    kind: Service
    name:  {{ template "odm.decisionrunner.fullname" . }}
    weight: 100
  wildcardPolicy: None

{{- end }}
